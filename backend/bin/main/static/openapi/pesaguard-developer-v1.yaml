components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque}
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    ProjectId: {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    EnvironmentId: {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
    KeyId: {name: keyId, in: path, required: true, schema: {type: string, format: uuid}}
    MembershipId: {name: membershipId, in: path, required: true, schema: {type: string, format: uuid}}
    InvitationId: {name: invitationId, in: path, required: true, schema: {type: string, format: uuid}}
    RoleId: {name: roleId, in: path, required: true, schema: {type: string, format: uuid}}
    AssignmentId: {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    MemberId: {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
    RequestId: {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    ApplicationId: {name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}
    ConsentId: {name: consentId, in: path, required: true, schema: {type: string, format: uuid}}
    ScopeName: {name: scopeName, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{1,47}:[a-z][a-z0-9-]{1,23}$'}}
    SandboxId: {name: sandboxId, in: path, required: true, schema: {type: string, format: uuid}}
    AssignmentId: {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    ApiKeyId: {name: apiKeyId, in: query, required: true, schema: {type: string, format: uuid}}
    Reason: {name: reason, in: query, required: false, schema: {type: string, maxLength: 500}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    IncludeDeprecated: {name: includeDeprecated, in: query, required: false, schema: {type: boolean, default: false}}
  requestBodies:
    Register: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
    Login: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
    CreateOrganization: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateOrganizationRequest'}}}}
    UpdateOrganization: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateOrganizationRequest'}}}}
    VerifyOrganization: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyOrganizationRequest'}}}}
    TransferOwnership: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferOwnershipRequest'}}}}
    UpdateSecuritySettings: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSecuritySettingsRequest'}}}}
    CreateInvitation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateInvitationRequest'}}}}
    AcceptInvitation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptInvitationRequest'}}}}
    UpdateMemberStatus: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMemberStatusRequest'}}}}
    ChangeMemberRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeMemberRoleRequest'}}}}
    CreateProject: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProjectRequest'}}}}
    CreateEnvironment: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateEnvironmentRequest'}}}}
    UpdateProject: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProjectRequest'}}}}
    TransferProjectOwnership: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferProjectOwnershipRequest'}}}}
    AddProjectMember: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddProjectMemberRequest'}}}}
    ChangeProjectMemberRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeProjectMemberRoleRequest'}}}}
    UpdateProjectSettings: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProjectSettingsRequest'}}}}
    UpdateEnvironmentConfiguration: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateEnvironmentConfigurationRequest'}}}}
    PromoteEnvironment: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PromoteEnvironmentRequest'}}}}
    CreateRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateRoleRequest'}}}}
    UpdateRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateRoleRequest'}}}}
    GrantRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GrantRoleRequest'}}}}
    RequestProductionAccess: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RequestProductionAccessRequest'}}}}
    ReviewProductionAccess: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductionAccessReviewRequest'}}}}
    CreateApiKey: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateApiKeyRequest'}}}}
    CreateApplication: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateApplicationRequest'}}}}
    UpdateApplication: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateApplicationRequest'}}}}
    VerifyApplication: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyApplicationRequest'}}}}
    AuthorizationRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationRequestBody'}}}}
    TokenRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TokenRequestBody'}}}}
    AssignScopes: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignScopesRequest'}}}}
    DeprecateScope: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeprecateScopeRequest'}}}}
    CreateSandbox: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateSandboxRequest'}}}}
    UpdateSandboxLimits: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSandboxLimitsRequest'}}}}
  responses:
    AuthCreated: {description: Created; access token is returned once, content: {application/json: {schema: {$ref: '#/components/schemas/AuthEnvelope'}}}}
    Auth: {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/AuthEnvelope'}}}}
    KeyCreated: {description: One-time API key response; never cached, headers: {Cache-Control: {schema: {type: string, example: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/KeyEnvelope'}}}}
    Data: {description: Successful response envelope, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    Error: {description: Structured client error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    RateLimited: {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    InvitationCreated: {description: Invitation created; the invitation token is returned once and only stored as a hash, headers: {Cache-Control: {schema: {type: string, example: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationCreatedEnvelope'}}}}
    ApplicationCreated: {description: Application or rotated secret. clientSecret appears exactly once and is only stored as an HMAC, headers: {Cache-Control: {schema: {type: string, example: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationSecretEnvelope'}}}}
    TokenIssued: {description: Issued access and refresh tokens. Token responses are never cached, headers: {Cache-Control: {schema: {type: string, example: no-store}}, Pragma: {schema: {type: string, example: no-cache}}}, content: {application/json: {schema: {$ref: '#/components/schemas/TokenEnvelope'}}}}
  schemas:
    RegisterRequest: {type: object, required: [email, password, displayName, organizationName], properties: {email: {type: string, format: email, maxLength: 320}, password: {type: string, format: password, minLength: 12, maxLength: 128}, displayName: {type: string, minLength: 2, maxLength: 120}, organizationName: {type: string, minLength: 2, maxLength: 120}}}
    LoginRequest: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, format: password}, organizationId: {type: string, format: uuid, description: Required when the account has memberships in more than one active organization}}}
    CreateOrganizationRequest: {type: object, required: [name, type, metadata], properties: {name: {type: string, minLength: 2, maxLength: 120}, type: {type: string, enum: [DEVELOPER, ENTERPRISE, PARTNER]}, metadata: {type: object, description: Free-form organization metadata; key, depth and size limits are enforced and credential-like keys are rejected}}}
    UpdateOrganizationRequest: {type: object, required: [name, type, metadata], properties: {name: {type: string, minLength: 2, maxLength: 120}, type: {type: string, enum: [DEVELOPER, ENTERPRISE, PARTNER]}, metadata: {type: object}}}
    VerifyOrganizationRequest: {type: object, required: [reference], properties: {reference: {type: string, maxLength: 120}}}
    TransferOwnershipRequest: {type: object, required: [membershipId], properties: {membershipId: {type: string, format: uuid}}}
    UpdateSecuritySettingsRequest: {type: object, required: [allowedAuthMethods, sessionTtlMinutes, idleTimeoutMinutes, maxSessions, credentialMinLength, credentialMaxLength, mfaRequired, ipAllowlist, securityEventTypes], properties: {allowedAuthMethods: {type: array, items: {type: string, enum: [PASSWORD]}}, sessionTtlMinutes: {type: integer, minimum: 5, maximum: 10080}, idleTimeoutMinutes: {type: integer, minimum: 5, maximum: 10080}, maxSessions: {type: integer, minimum: 1, maximum: 100}, credentialMinLength: {type: integer, minimum: 12, maximum: 64}, credentialMaxLength: {type: integer, minimum: 24, maximum: 72}, mfaRequired: {type: boolean, description: Rejected while no MFA provider is configured}, ipAllowlist: {type: array, items: {type: string, description: IPv4/IPv6 address or CIDR range}}, securityEventTypes: {type: array, items: {type: string, enum: [LOGIN_FAILURE, MEMBERSHIP_CHANGED, SECURITY_SETTING_CHANGED, ORGANIZATION_LIFECYCLE, INVITATION_CREATED, INVITATION_ACCEPTED, INVITATION_REVOKED]}}}}
    CreateInvitationRequest: {type: object, required: [email, role], properties: {email: {type: string, format: email, maxLength: 320}, role: {type: string, enum: [ADMIN, DEVELOPER, VIEWER]}}}
    AcceptInvitationRequest: {type: object, required: [token, email, password], properties: {token: {type: string, maxLength: 512}, email: {type: string, format: email, maxLength: 320}, password: {type: string, format: password, minLength: 12, maxLength: 128}, displayName: {type: string, minLength: 2, maxLength: 120, description: Required only when the invited email does not yet have an account}}}
    UpdateMemberStatusRequest: {type: object, required: [status], properties: {status: {type: string, enum: [ACTIVE, SUSPENDED, REVOKED]}, reason: {type: string, maxLength: 500}}}
    ChangeMemberRoleRequest: {type: object, required: [role], properties: {role: {type: string, enum: [ADMIN, DEVELOPER, VIEWER]}}}
    InvitationCreatedEnvelope: {type: object, required: [data, requestId], properties: {data: {type: object, required: [id, email, role, token, expiresAt], properties: {id: {type: string, format: uuid}, email: {type: string, format: email}, role: {type: string}, token: {type: string, description: Returned only when the invitation is created; stored server-side as a hash}, expiresAt: {type: string, format: date-time}}}, requestId: {type: string, format: uuid}}}
    CreateProjectRequest: {type: object, required: [name, slug], properties: {name: {type: string, minLength: 2, maxLength: 120}, slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,79}$'}}}
    CreateEnvironmentRequest: {type: object, required: [name, type], properties: {name: {type: string, minLength: 2, maxLength: 80}, type: {type: string, enum: [DEVELOPMENT, SANDBOX, STAGING, PRODUCTION], description: A project may hold at most one environment per tier}}}
    UpdateProjectRequest: {type: object, required: [name, metadata], properties: {name: {type: string, minLength: 2, maxLength: 120}, description: {type: string, maxLength: 500}, metadata: {type: object, description: Credential-like keys are rejected}}}
    TransferProjectOwnershipRequest: {type: object, required: [userId], properties: {userId: {type: string, format: uuid, description: Must already be an active organization member}}}
    AddProjectMemberRequest: {type: object, required: [userId, role], properties: {userId: {type: string, format: uuid}, role: {type: string, enum: [MANAGER, DEVELOPER, VIEWER]}}}
    ChangeProjectMemberRoleRequest: {type: object, required: [role], properties: {role: {type: string, enum: [MANAGER, DEVELOPER, VIEWER]}}}
    UpdateProjectSettingsRequest: {type: object, required: [settings], properties: {settings: {type: object}}}
    UpdateEnvironmentConfigurationRequest: {type: object, required: [configuration], properties: {configuration: {type: object, description: Credential-like keys are rejected; secrets belong in environment credentials}}}
    PromoteEnvironmentRequest: {type: object, required: [targetType], properties: {targetType: {type: string, enum: [DEVELOPMENT, SANDBOX, STAGING, PRODUCTION], description: Must be exactly one tier above the current tier}, reason: {type: string, maxLength: 500}}}
    CreateRoleRequest: {type: object, required: [name, permissions], properties: {name: {type: string, minLength: 2, maxLength: 64}, description: {type: string, maxLength: 500}, permissions: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {type: string, description: Must be a catalog permission the caller already holds; request and review may not be combined}}}}
    UpdateRoleRequest: {type: object, required: [name, permissions], properties: {name: {type: string, minLength: 2, maxLength: 64}, description: {type: string, maxLength: 500}, permissions: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {type: string}}}}
    GrantRoleRequest: {type: object, required: [userId], properties: {userId: {type: string, format: uuid, description: Must be an active organization member}}}
    RequestProductionAccessRequest: {type: object, required: [environmentId, reason], properties: {environmentId: {type: string, format: uuid}, reason: {type: string, minLength: 10, maxLength: 1000}}}
    ProductionAccessReviewRequest: {type: object, properties: {note: {type: string, maxLength: 1000}, expiresIn: {type: string, description: Required to approve; ISO-8601 duration no longer than 7 days, example: PT2H}}}
    CreateApiKeyRequest: {type: object, required: [name, scopes, expiresIn], properties: {name: {type: string, minLength: 2, maxLength: 120}, scopes: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string}}, expiresIn: {type: string, example: PT24H}}}
    CreateApplicationRequest: {type: object, required: [name, redirectUris, grantTypes, responseTypes, tokenEndpointAuthMethod, scopes], properties: {name: {type: string, minLength: 2, maxLength: 120}, description: {type: string, maxLength: 500}, redirectUris: {type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: {type: string, format: uri, description: HTTPS required except loopback HTTP; matched exactly, never by prefix}}, grantTypes: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: string, enum: [authorization_code, refresh_token]}}, responseTypes: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {type: string, enum: [code]}}, tokenEndpointAuthMethod: {type: string, enum: [client_secret_basic], description: Only confidential-client authentication is supported}, scopes: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string}}, metadata: {type: object}}}
    UpdateApplicationRequest: {type: object, properties: {name: {type: string, minLength: 2, maxLength: 120}, description: {type: string, maxLength: 500}, redirectUris: {type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: {type: string, format: uri}}, scopes: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string}}, metadata: {type: object}}}
    VerifyApplicationRequest: {type: object, required: [reference], properties: {reference: {type: string, maxLength: 120}}}
    AuthorizationRequestBody: {type: object, required: [clientId, redirectUri, responseType, codeChallenge, codeChallengeMethod], properties: {clientId: {type: string, maxLength: 120}, redirectUri: {type: string, format: uri}, responseType: {type: string, enum: [code]}, scope: {type: string}, state: {type: string, maxLength: 512, description: Hashed for storage and returned to the client on approval}, codeChallenge: {type: string, minLength: 43, maxLength: 128}, codeChallengeMethod: {type: string, enum: [S256], description: S256 is mandatory; plain is rejected}}}
    TokenRequestBody: {type: object, required: [grantType, clientId], properties: {grantType: {type: string, enum: [authorization_code, refresh_token]}, clientId: {type: string}, clientSecret: {type: string, description: Prefer HTTP Basic authentication; the form field exists for clients that cannot set headers}, code: {type: string}, redirectUri: {type: string, format: uri}, codeVerifier: {type: string, minLength: 43, maxLength: 128}, refreshToken: {type: string}, scope: {type: string}}}
    ApplicationSecretEnvelope: {type: object, required: [data, requestId], properties: {data: {type: object, required: [id, clientId, clientSecret, status], properties: {id: {type: string, format: uuid}, clientId: {type: string}, clientSecret: {type: string, description: Returned exactly once and only stored as an HMAC}, status: {type: string, enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, REVOKED]}}}, requestId: {type: string, format: uuid}}}
    TokenEnvelope: {type: object, required: [data, requestId], properties: {data: {type: object, required: [accessToken, tokenType, expiresIn, refreshToken, scope], properties: {accessToken: {type: string}, tokenType: {type: string, example: Bearer}, expiresIn: {type: integer, example: 900}, refreshToken: {type: string, description: Rotated on every use; presenting a rotated token revokes the whole family}, scope: {type: string}}}, requestId: {type: string, format: uuid}}}
    AssignScopesRequest: {type: object, required: [scopes], properties: {scopes: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9-]{1,47}:[a-z][a-z0-9-]{1,23}$', description: Must exist in the registry; an unknown scope is rejected, never created}}}}
