openapi: 3.1.0
info:
  title: PesaGuard Developer Platform API
  version: 0.1.0
  description: Implemented secure developer-platform foundation. OAuth, billing, production environments, webhooks, and financial execution are out of scope.
servers:
  - {url: 'http://localhost:8080', description: Local development}
security:
  - {bearerAuth: []}
paths:
  /api/v1/auth/register:
    post: {security: [], requestBody: {$ref: '#/components/requestBodies/Register'}, responses: {'201': {$ref: '#/components/responses/AuthCreated'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/login:
    post: {security: [], requestBody: {$ref: '#/components/requestBodies/Login'}, responses: {'200': {$ref: '#/components/responses/Auth'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  /api/v1/auth/logout:
    post: {responses: {'204': {description: Session revoked}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/auth/session:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}}}
    post: {requestBody: {$ref: '#/components/requestBodies/CreateOrganization'}, responses: {'201': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
    patch: {requestBody: {$ref: '#/components/requestBodies/UpdateOrganization'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
    delete: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/verify:
    post: {requestBody: {$ref: '#/components/requestBodies/VerifyOrganization'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/suspend:
    post: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/restore:
    post: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/disable:
    post: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/ownership/transfer:
    post: {requestBody: {$ref: '#/components/requestBodies/TransferOwnership'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/security-settings:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
    put: {requestBody: {$ref: '#/components/requestBodies/UpdateSecuritySettings'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/members:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/organization/members/{membershipId}/history:
    get: {parameters: [{$ref: '#/components/parameters/MembershipId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/members/{membershipId}/status:
    patch: {parameters: [{$ref: '#/components/parameters/MembershipId'}], requestBody: {$ref: '#/components/requestBodies/UpdateMemberStatus'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/members/{membershipId}/role:
    patch: {parameters: [{$ref: '#/components/parameters/MembershipId'}], requestBody: {$ref: '#/components/requestBodies/ChangeMemberRole'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/invitations:
    post: {requestBody: {$ref: '#/components/requestBodies/CreateInvitation'}, responses: {'201': {$ref: '#/components/responses/InvitationCreated'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/invitations/accept:
    post: {security: [], requestBody: {$ref: '#/components/requestBodies/AcceptInvitation'}, responses: {'201': {$ref: '#/components/responses/AuthCreated'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/organization/invitations/{invitationId}:
    delete: {parameters: [{$ref: '#/components/parameters/InvitationId'}], responses: {'204': {description: Revoked}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/rbac/permissions:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/rbac/permissions/effective:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/rbac/roles/built-in:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/rbac/roles:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
    post: {requestBody: {$ref: '#/components/requestBodies/CreateRole'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/rbac/roles/{roleId}:
    patch: {parameters: [{$ref: '#/components/parameters/RoleId'}], requestBody: {$ref: '#/components/requestBodies/UpdateRole'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/rbac/roles/{roleId}/archive:
    post: {parameters: [{$ref: '#/components/parameters/RoleId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/rbac/roles/{roleId}/restore:
    post: {parameters: [{$ref: '#/components/parameters/RoleId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/rbac/roles/{roleId}/assignments:
    post: {parameters: [{$ref: '#/components/parameters/RoleId'}], requestBody: {$ref: '#/components/requestBodies/GrantRole'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/rbac/role-assignments:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/rbac/role-assignments/{assignmentId}:
    delete: {parameters: [{$ref: '#/components/parameters/AssignmentId'}], responses: {'204': {description: Revoked}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/production-access/projects/{projectId}/requests:
    post: {parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/RequestProductionAccess'}, responses: {'201': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/production-access/requests:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/production-access/requests/{requestId}/approve:
    post: {parameters: [{$ref: '#/components/parameters/RequestId'}], requestBody: {$ref: '#/components/requestBodies/ReviewProductionAccess'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/production-access/requests/{requestId}/reject:
    post: {parameters: [{$ref: '#/components/parameters/RequestId'}], requestBody: {$ref: '#/components/requestBodies/ReviewProductionAccess'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/production-access/requests/{requestId}/cancel:
    post: {parameters: [{$ref: '#/components/parameters/RequestId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/applications:
    post: {requestBody: {$ref: '#/components/requestBodies/CreateApplication'}, responses: {'201': {$ref: '#/components/responses/ApplicationCreated'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/applications/{applicationId}:
    patch: {parameters: [{$ref: '#/components/parameters/ApplicationId'}], requestBody: {$ref: '#/components/requestBodies/UpdateApplication'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/applications/{applicationId}/verify:
    post: {parameters: [{$ref: '#/components/parameters/ApplicationId'}], requestBody: {$ref: '#/components/requestBodies/VerifyApplication'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/applications/{applicationId}/rotate-secret:
    post: {parameters: [{$ref: '#/components/parameters/ApplicationId'}], responses: {'201': {$ref: '#/components/responses/ApplicationCreated'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/applications/{applicationId}/suspend:
    post: {parameters: [{$ref: '#/components/parameters/ApplicationId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/applications/{applicationId}/resume:
    post: {parameters: [{$ref: '#/components/parameters/ApplicationId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/applications/{applicationId}/revoke:
    post: {parameters: [{$ref: '#/components/parameters/ApplicationId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/authorize:
    post: {description: 'Records an authorization request. No code is issued until the resource owner approves the consent request.', requestBody: {$ref: '#/components/requestBodies/AuthorizationRequest'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  /api/v1/oauth/consents:
    get: {responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/consents/{consentId}/approve:
    post: {description: 'The only operation that issues an authorization code.', parameters: [{$ref: '#/components/parameters/ConsentId'}], responses: {'201': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/consents/{consentId}/deny:
    post: {parameters: [{$ref: '#/components/parameters/ConsentId'}], responses: {'204': {description: Denied}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/oauth/token:
    post: {security: [], description: 'Authorization-code and refresh-token grants. PKCE S256 is mandatory and refresh tokens rotate on every use.', requestBody: {$ref: '#/components/requestBodies/TokenRequest'}, responses: {'200': {$ref: '#/components/responses/TokenIssued'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  /api/v1/oauth/revoke:
    post: {security: [], description: 'RFC 7009. Unknown tokens report success so the endpoint cannot probe token existence.', responses: {'204': {description: Revoked}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  /api/v1/oauth/introspect:
    post: {security: [], description: 'RFC 7662 introspection. Requires client authentication.', responses: {'200': {$ref: '#/components/responses/Data'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  /api/v1/sandboxes:
    post: {description: 'Creates a sandbox against an existing SANDBOX environment. Any other environment type is refused.', requestBody: {$ref: '#/components/requestBodies/CreateSandbox'}, responses: {'201': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
    get: {parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/sandboxes/{sandboxId}:
    get: {parameters: [{$ref: '#/components/parameters/SandboxId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
    delete: {description: 'Terminal. A deleted sandbox cannot be suspended, activated or reset.', parameters: [{$ref: '#/components/parameters/SandboxId'}, {$ref: '#/components/parameters/Reason'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/sandboxes/{sandboxId}/activate:
    post: {parameters: [{$ref: '#/components/parameters/SandboxId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/sandboxes/{sandboxId}/suspend:
    post: {parameters: [{$ref: '#/components/parameters/SandboxId'}, {$ref: '#/components/parameters/Reason'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/sandboxes/{sandboxId}/resume:
    post: {description: 'An expired sandbox cannot be resumed.', parameters: [{$ref: '#/components/parameters/SandboxId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/sandboxes/{sandboxId}/reset:
    post: {description: 'Clears sandbox data. Does not change lifecycle status.', parameters: [{$ref: '#/components/parameters/SandboxId'}, {$ref: '#/components/parameters/Reason'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/sandboxes/{sandboxId}/executions:
    get: {parameters: [{$ref: '#/components/parameters/SandboxId'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/sandboxes/{sandboxId}/limits:
    get: {parameters: [{$ref: '#/components/parameters/SandboxId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
    put: {parameters: [{$ref: '#/components/parameters/SandboxId'}], requestBody: {$ref: '#/components/requestBodies/UpdateSandboxLimits'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/scopes:
    get: {description: 'The scope registry. Scopes are API permissions, distinct from RBAC portal permissions.', parameters: [{$ref: '#/components/parameters/IncludeDeprecated'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/scopes/{scopeName}:
    get: {parameters: [{$ref: '#/components/parameters/ScopeName'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/scopes/{scopeName}/deprecate:
    post: {description: 'Marks a scope deprecated. The scope keeps working; callers are told what to migrate to.', parameters: [{$ref: '#/components/parameters/ScopeName'}], requestBody: {$ref: '#/components/requestBodies/DeprecateScope'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/scopes/{scopeName}/restrict:
    post: {description: 'Restricts a scope further. A reason is required.', parameters: [{$ref: '#/components/parameters/ScopeName'}, {$ref: '#/components/parameters/Reason'}], responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/scopes/assignments:
    get: {parameters: [{$ref: '#/components/parameters/ApiKeyId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
    post: {description: 'Grants scopes to a credential, recording who granted each and at which scope version.', parameters: [{$ref: '#/components/parameters/ApiKeyId'}], requestBody: {$ref: '#/components/requestBodies/AssignScopes'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/scopes/assignments/{assignmentId}:
    delete: {parameters: [{$ref: '#/components/parameters/AssignmentId'}, {$ref: '#/components/parameters/Reason'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/scopes/decisions/denied:
    get: {description: 'Recent access denials with their per-factor trace, so a refusal can be explained.', parameters: [{$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects:
    post: {requestBody: {$ref: '#/components/requestBodies/CreateProject'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
    get: {parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}], responses: {'200': {$ref: '#/components/responses/Data'}}}
  /api/v1/projects/{projectId}:
    get: {parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/UpdateProject'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/archive:
    post: {parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/restore:
    post: {parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/deactivate:
    post: {parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/activate:
    post: {parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/ownership/transfer:
    post: {parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/TransferProjectOwnership'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/members:
    get: {parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
    post: {parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/AddProjectMember'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/members/{memberId}/role:
    patch: {parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/MemberId'}], requestBody: {$ref: '#/components/requestBodies/ChangeProjectMemberRole'}, responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/members/{memberId}:
    delete: {parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/MemberId'}], responses: {'204': {description: Revoked}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/settings:
    get: {parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
    put: {parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/UpdateProjectSettings'}, responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/v1/projects/{projectId}/environments:
