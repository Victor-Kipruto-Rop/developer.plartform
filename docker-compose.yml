services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pesaguard_developer_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    # Rate-limit counters only. appendonly is deliberately off: every value here is
    # a recomputable rate-limit counter, and persisting them would cost I/O on the
    # hot path to protect state that is correct to lose on restart (a restart
    # should not hand a flooder a fresh budget mid-window).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pesaguard_developer_platform}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      PESAGUARD_ALLOWED_ORIGINS: ${PESAGUARD_ALLOWED_ORIGINS:?PESAGUARD_ALLOWED_ORIGINS is required}
      PESAGUARD_CREDENTIAL_HMAC_KEY: ${PESAGUARD_CREDENTIAL_HMAC_KEY:?PESAGUARD_CREDENTIAL_HMAC_KEY is required}
      PESAGUARD_AUDIT_HMAC_KEY: ${PESAGUARD_AUDIT_HMAC_KEY:?PESAGUARD_AUDIT_HMAC_KEY is required}
      PESAGUARD_REGISTRATION_ENABLED: ${PESAGUARD_REGISTRATION_ENABLED:-false}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  postgres-data:
